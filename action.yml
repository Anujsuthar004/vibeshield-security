name: VibeShield Security Scan
description: Scan Next.js + Supabase + Stripe + Clerk apps for vibe-coded security mistakes. Annotates PRs, writes a job summary, uploads SARIF.
author: VibeShield
branding:
  icon: shield
  color: green

inputs:
  path:
    description: Directory to scan, relative to the repository root.
    default: "."
  fail-on:
    description: Fail the job when a finding is at this severity or above. One of critical, high, medium, low, none.
    default: high
  dependency-scan:
    description: Look up dependency CVEs on osv.dev (needs network access).
    default: "true"
  upload-sarif:
    description: "Upload results to GitHub Code Scanning. Needs `security-events: write`, and Code Scanning enabled on the repository."
    default: "true"
  sarif-file:
    description: Where to write the SARIF report.
    default: vibeshield.sarif

outputs:
  findings:
    description: Number of active (unsuppressed) findings.
    value: ${{ steps.report.outputs.findings }}
  score:
    description: Security score, 0-100.
    value: ${{ steps.report.outputs.score }}
  sarif-file:
    description: Path to the SARIF report.
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Install VibeShield
      shell: bash
      run: |
        major="$(node -p 'process.versions.node.split(".")[0]')"
        if [ "$major" -lt 20 ]; then
          echo "::error::VibeShield needs Node 20 or newer on the runner (found $(node -v)). Add actions/setup-node before this step."
          exit 1
        fi
        cd "$GITHUB_ACTION_PATH"
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error

    - name: Scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        DEPENDENCY_SCAN: ${{ inputs.dependency-scan }}
      run: |
        deps_flag=""
        if [ "$DEPENDENCY_SCAN" != "true" ]; then deps_flag="--no-deps"; fi
        node "$GITHUB_ACTION_PATH/scripts/cli.js" "$SCAN_PATH" --json --quiet $deps_flag -o "$RUNNER_TEMP/vibeshield.json"

    - name: Report
      id: report
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        node "$GITHUB_ACTION_PATH/scripts/github-report.js" "$RUNNER_TEMP/vibeshield.json" \
          --path "$SCAN_PATH" --fail-on "$FAIL_ON" --sarif "$SARIF_FILE"

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: vibeshield

    - name: Enforce fail-on
      if: ${{ steps.report.outputs.failed == 'true' }}
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::VibeShield found issues at '$FAIL_ON' severity or above. See the job summary for details."
        exit 1
